<template id="tp-log-reg">
  <article id="log-reg" class=page>
    <div class="login-c">
      <input type="text" id="log-username" placeholder="Jméno uživatele">
      <input type="password" id="log-password" placeholder="Heslo">
      <button onclick="login()">Přihlásit</button>
    </div>
    <div class="register-c">
      <input type="text" id="reg-username" maxlength=16 minlength=3 pattern=[A-Za-z0-9]{3,16} placeholder="Jméno uživatele">
      <input type="password" id="reg-password" placeholder="Heslo">
      <input type="number" id="reg-age" min="15" max="99" placeholder="Věk">
      <input type="text" id="reg-picture" placeholder="URL profilovky">
      <button onclick="register()">Registrovat</button>
    </div>
    
  </article>
</template>

<template id="tp-reg">
   <article id=reg class=page>
      <div id=reg-c>
         <div id=reg-text>
            <h1>Registrace</h1>
            <p>Zadejte svou přezdívku
         </div>
         <form onsubmit=regCheck()>
            <input autofocus id=nick maxlength=16 minlength=3 pattern=[A-Za-z0-9]{3,16} placeholder=Přezdívka style="border-radius:10px;background:#dedede;max-width:100%;border:none;padding:8px 16px;color:#212121;min-height:48px">
            <div id=reg-buttons><button type=submit>Další</button> <button>Zpět</button></div>
         </form>
      </div>
   </article>
</template>
